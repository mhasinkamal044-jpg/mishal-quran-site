<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الدخول | مجمع مشعل الحميدي</title>
<link rel="stylesheet" href="index.css">
</head>
<body>
<div class="auth">
  <aside class="auth-side scene">
    <h1>مجمع مشعل الحميدي</h1>
    <p>حلقات تحفيظ القرآن الكريم. سجّل دخولك لتتابع حفظك ومراجعتك أولاً بأول.</p>
  </aside>
  <main class="auth-main">
    <div class="auth-box">
      <div class="tabs" role="tablist">
        <button class="on" id="tabLogin" type="button">تسجيل الدخول</button>
        <button id="tabSignup" type="button">إنشاء حساب</button>
      </div>

      <form id="loginForm" novalidate>
        <label for="lEmail">البريد الإلكتروني</label>
        <input id="lEmail" type="email" autocomplete="email" required>
        <label for="lPass">كلمة المرور</label>
        <input id="lPass" type="password" autocomplete="current-password" required>
        <button class="btn dark wide" style="margin-top:20px" type="submit">دخول</button>
        <div class="msg" id="lMsg" role="alert"></div>
        <p class="switch">ليس لديك حساب؟ <a href="#signup" id="toSignup">أنشئ حساباً جديداً</a></p>
      </form>

      <form id="signupForm" class="hidden" novalidate>
        <label for="sName">الاسم الكامل</label>
        <input id="sName" type="text" autocomplete="name" required>
        <label for="sEmail">البريد الإلكتروني</label>
        <input id="sEmail" type="email" autocomplete="email" required>
        <div class="row">
          <div><label for="sPass">كلمة المرور</label><input id="sPass" type="password" autocomplete="new-password" required></div>
          <div><label for="sPass2">تأكيد كلمة المرور</label><input id="sPass2" type="password" autocomplete="new-password" required></div>
        </div>
        <button class="btn dark wide" style="margin-top:20px" type="submit">إنشاء الحساب</button>
        <div class="msg" id="sMsg" role="alert"></div>
        <p class="switch">لديك حساب بالفعل؟ <a href="#login" id="toLogin">سجّل الدخول</a></p>
      </form>
    </div>
  </main>
</div>
<script src="common.js"></script>
<script src="index.js"></script>
</body>
</html>
